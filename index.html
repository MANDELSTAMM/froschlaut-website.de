<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FROSCHLAUT</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #eee;
}

header {
  background: #222;
  padding: 30px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 3em;
  color: #0f0;
  text-shadow: 0 0 15px #0f0;
  position: relative;
  display: inline-block;

  /* GLITCH HERE (RARE) */
  animation: glitchBase 8s infinite;
}

/* MAIN RARE GLITCH */
@keyframes glitchBase {
  0%, 94%, 100% { transform: translate(0,0); }
  95% { transform: translate(2px,-1px); }
  96% { transform: translate(-2px,1px); }
  97% { transform: translate(1px,0px); }
  98% { transform: translate(0px,-1px); }
  99% { transform: translate(-1px,0px); }
}

/* VERY RARE COLOR SHIFT (LOW INTENSITY) */
header h1::before,
header h1::after {
  content: "FROSCHLAUT";
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  opacity: 0;
  pointer-events: none;
}

/* PURPLE (very rare) */
header h1::before {
  color: #ff00ff;
  transform: translate(1px, 0);
  animation: glitchFlash 8s infinite;
}

/* CYAN (very rare) */
header h1::after {
  color: #00ffff;
  transform: translate(-1px, 0);
  animation: glitchFlash 8s infinite;
}

/* FLASH CONTROL */
@keyframes glitchFlash {
  0%, 93%, 100% { opacity: 0; }
  94% { opacity: 1; }
  95% { opacity: 0; }
  96% { opacity: 1; }
  97% { opacity: 0; }
}

nav {
  background: #333;
  padding: 10px;
  text-align: center;
}

nav a {
  color: #eee;
  margin: 0 15px;
  text-decoration: none;
}

nav a:hover {
  color: #0f0;
}

section {
  padding: 30px;
  text-align: center;
}

h2 {
  color: #0f0;
  font-size: 2.2em;
  text-shadow: 0 0 10px #0f0;
}

.gallery img { 
  max-width: 90%; 
  border: 4px solid #0f0; 
  margin-top: 15px; 
}

.music-list {
  max-width: 900px;
  margin: auto;
}

.player {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #1a1a1a;
  border: 1px solid #0f0;
  padding: 10px;
  margin-bottom: 10px;
  transition: 0.2s;
}

/* 🔥 ACTIVE (ADDED ONLY) */
.player.active {
  border: 1px solid #0f0;
  box-shadow: 0 0 20px rgba(0,255,0,0.4);
  transform: scale(1.02);
}

.track-title {
  width: 260px;
  text-align: left;
  font-size: 13px;
}

.artist {
  color: #0f0;
  font-weight: bold;
}

.song {
  color: #fff;
  opacity: 0.9;
}

.play-btn {
  background: transparent;
  border: 1px solid #0f0;
  color: #0f0;
  padding: 4px 10px;
  cursor: pointer;
}

.play-btn:hover {
  background: #0f0;
  color: #000;
}

.progress {
  flex: 1;
  height: 8px;
  background: #000;
  border: 1px solid #ff4fd8;
  cursor: pointer;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff4fd8, #ff00aa);
}

.volume {
  width: 90px;
}

audio {
  display: none;
}

footer {
  background: #222;
  color: #aaa;
  text-align: center;
  padding: 20px;
}
</style>
</head>
